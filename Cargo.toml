[package]
name = "slowspot"
version = "0.1.0"
edition = "2021"
description = "Lightweight Windows performance monitor identifying PC bottleneck culprits"
readme = "README.md"
license = "MIT"
keywords = ["windows", "system-monitor", "performance", "gui", "portable"]
categories = ["command-line-utilities", "gui"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
sysinfo = "0.40"
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
